name: Build Windows test exe

# Test builds of this branch: zips dist/ADIAT (the same folder
# `python setup.py bdist_app` builds locally) and publishes it as a
# pre-release, replaced on every push, so the change can be tried on
# Windows without a local build toolchain.
#
# The pre-release has its own tag rather than the shared
# 'windows-test-build' one, so publishing it leaves the combined test
# build in place.
on:
  push:
    branches: [test/gallery-multi-select-windows]
  workflow_dispatch:

permissions:
  contents: write  # publish the pre-release

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: windows-test-build-gallery-multi-select

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Check out files byte-for-byte as committed so the build stamp in
      # app.spec does not read the tree as '+dirty'
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test the gallery multi-select change on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest -q -p no:cacheprovider --no-cov
          app/tests/core/controllers/images/viewer/gallery
          app/tests/core/controllers/images/viewer/test_viewer_duplicate_key.py
          app/tests/core/controllers/images/viewer/similarity/test_aoi_duplicate_marking.py
          app/tests/core/controllers/images/viewer/aoi/test_aoi_controller.py
          app/tests/helpers/test_ui_module_hygiene.py

      - name: Build
        run: python setup.py bdist_app

      - name: Show build stamp
        id: stamp
        run: |
          $stamp = (Get-Content dist/ADIAT/_internal/build_info.txt -TotalCount 1).Trim()
          Write-Output "Build stamp: $stamp"
          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          # '+' in a download name can be decoded as a space along the way
          "zip=ADIAT-windows-$($stamp.Replace('+', '-')).zip" >> $env:GITHUB_OUTPUT

      - name: Zip the build
        run: 7z a -tzip -mx=5 "${{ steps.stamp.outputs.zip }}" ./dist/ADIAT

      - name: Publish the pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "${{ steps.stamp.outputs.zip }}" \
            --prerelease --target "${{ github.sha }}" \
            --title "Windows test build: gallery multi-select (${{ steps.stamp.outputs.stamp }})" \
            --notes "Test build of branch ${{ github.ref_name }} at ${{ github.sha }}: upstream dev_2_2 plus Ctrl+click multi-select in the AOI gallery for marking duplicates. Not an official ADIAT release. Unzip the whole folder and run ADIAT/ADIAT.exe."
